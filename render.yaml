databases:
  - name: wbtracker-db
    databaseName: wb_tracker
    user: wbuser
    plan: free  # switch to 'starter' or higher before the 30-day free trial ends

services:
  # --- Backend: FastAPI (Docker) ---
  - type: web
    name: wbtracker-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free  # bump to 'starter' for always-on (free tier spins down when idle)
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: wbtracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wbtracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: wbtracker-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: wbtracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wbtracker-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: wbtracker-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://wbtracker-frontend.onrender.com  # update after frontend is created

  # --- Frontend: React/Vite (static site) ---
  - type: web
    name: wbtracker-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://wbtracker-backend.onrender.com  # update after backend is created, no trailing slash
    routes:
      - type: rewrite
        source: /*
        destination: /index.html  # needed for client-side routing (React Router etc.)